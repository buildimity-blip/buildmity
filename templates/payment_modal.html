{% load static %}
<!-- Payment Modal -->
<div id="paymentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center;">
    <div style="max-width: 500px; width: 90%; background: white; border-radius: 24px; overflow: hidden; animation: slideIn 0.3s ease;">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #2563eb, #1e40af); color: white; padding: 24px; text-align: center; position: relative;">
            <button onclick="closePaymentModal()" style="position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;">✕</button>
            <h2 style="margin: 0 0 8px 0;"><i class="fas fa-credit-card"></i> Complete Payment</h2>
            <p style="margin: 0; opacity: 0.9;">Secure payment for your service</p>
        </div>
        
        <!-- Body -->
        <div style="padding: 24px; max-height: 70vh; overflow-y: auto;">
            <div id="modalJobDetails" style="background: #f8fafc; border-radius: 16px; padding: 16px; margin-bottom: 20px;">
                <!-- Dynamic content -->
            </div>
            
            <div id="modalAmountDisplay" style="text-align: center; margin: 16px 0; padding: 16px; background: linear-gradient(135deg, #eff6ff, #dbeafe); border-radius: 16px;">
                <!-- Dynamic amount -->
            </div>
            
            <!-- Payment Options -->
            <div style="margin-bottom: 20px;">
                <div style="font-size: 12px; text-transform: uppercase; color: #64748b; margin-bottom: 12px;">Select Payment Method</div>
                
                <!-- Flutterwave Option -->
                <div id="optionFlutterwave" onclick="selectMethod('flutterwave')" style="border: 2px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer;">
                    <input type="radio" name="method" id="radioFlutterwave" checked style="width: 18px; height: 18px;">
                    <div style="font-size: 24px; width: 40px;"><i class="fas fa-bolt" style="color: #F5A623;"></i></div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700;">Flutterwave</div>
                        <div style="font-size: 12px; color: #64748b;">Card, Mobile Money, Bank Transfer</div>
                    </div>
                </div>
                
                <!-- Test Option -->
                <div id="optionTest" onclick="selectMethod('test')" style="border: 2px solid #e2e8f0; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer;">
                    <input type="radio" name="method" id="radioTest" style="width: 18px; height: 18px;">
                    <div style="font-size: 24px; width: 40px;"><i class="fas fa-flask" style="color: #22c55e;"></i></div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700;">Test Payment (Demo)</div>
                        <div style="font-size: 12px; color: #64748b;">For testing - No real money</div>
                    </div>
                </div>
            </div>
            
            <!-- Flutterwave Info -->
            <div id="flutterwaveInfo" style="background: #dbeafe; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; border-left: 3px solid #2563eb;">
                <i class="fas fa-external-link-alt"></i> You will be redirected to Flutterwave's secure payment page
            </div>
            
            <!-- Test Fields (hidden by default) -->
            <div id="testFields" style="display: none;">
                <div style="background: #fed7aa; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; border-left: 3px solid #f59e0b;">
                    <i class="fas fa-flask"></i> <strong>Test Mode</strong> - No real money will be deducted
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600;">Phone Number</label>
                    <input type="tel" id="testPhoneNumber" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px;" placeholder="e.g., 0789123456">
                </div>
            </div>
            
            <!-- Pay Button -->
            <button id="payModalBtn" onclick="processPayment()" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;">
                <i class="fas fa-lock"></i> Pay Now
            </button>
            
            <button onclick="closePaymentModal()" style="width: 100%; padding: 12px; background: #f1f5f9; border: none; border-radius: 12px; margin-top: 12px; cursor: pointer; font-weight: 600;">
                Cancel
            </button>
        </div>
    </div>
</div>

<style>
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    
    .selected-option {
        border-color: #2563eb !important;
        background: #eff6ff !important;
    }
</style>

<script>
    let selectedMethod = 'flutterwave';
    let currentRequestData = null;
    
    function openPaymentModal(requestId, providerName, serviceName, amount) {
        currentRequestData = {
            id: requestId,
            provider: providerName,
            service: serviceName,
            amount: amount
        };
        
        // Update job details
        document.getElementById('modalJobDetails').innerHTML = `
            <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0;">
                <span style="color: #64748b;">Provider</span>
                <span><strong>${escapeHtml(providerName)}</strong></span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 8px 0;">
                <span style="color: #64748b;">Service</span>
                <span><strong>${escapeHtml(serviceName)}</strong></span>
            </div>
        `;
        
        // Update amount display
        document.getElementById('modalAmountDisplay').innerHTML = `
            <div style="font-size: 12px; color: #64748b;">Total Amount</div>
            <div style="font-size: 28px; font-weight: 800; color: #2563eb;">UGX ${parseFloat(amount).toLocaleString()}</div>
        `;
        
        // Update button text
        document.getElementById('payModalBtn').innerHTML = `<i class="fas fa-lock"></i> Pay UGX ${parseFloat(amount).toLocaleString()}`;
        
        // Reset to Flutterwave option
        selectMethod('flutterwave');
        
        // Show modal
        document.getElementById('paymentModal').style.display = 'flex';
    }
    
    function selectMethod(method) {
        selectedMethod = method;
        
        const optionFlutterwave = document.getElementById('optionFlutterwave');
        const optionTest = document.getElementById('optionTest');
        const flutterwaveInfo = document.getElementById('flutterwaveInfo');
        const testFields = document.getElementById('testFields');
        
        if (method === 'flutterwave') {
            optionFlutterwave.classList.add('selected-option');
            optionTest.classList.remove('selected-option');
            document.getElementById('radioFlutterwave').checked = true;
            flutterwaveInfo.style.display = 'block';
            testFields.style.display = 'none';
        } else {
            optionTest.classList.add('selected-option');
            optionFlutterwave.classList.remove('selected-option');
            document.getElementById('radioTest').checked = true;
            flutterwaveInfo.style.display = 'none';
            testFields.style.display = 'block';
        }
    }
    
    function processPayment() {
        if (!currentRequestData) return;
        
        const payBtn = document.getElementById('payModalBtn');
        
        if (selectedMethod === 'flutterwave') {
            // Create form for Flutterwave
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = `/payment/initialize/${currentRequestData.id}/`;
            
            const csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = 'csrfmiddlewaretoken';
            csrfInput.value = getCsrfToken();
            
            form.appendChild(csrfInput);
            document.body.appendChild(form);
            form.submit();
        } 
        else if (selectedMethod === 'test') {
            const phone = document.getElementById('testPhoneNumber').value;
            
            if (!phone) {
                alert('Please enter your phone number for test payment');
                return;
            }
            
            // Show loading
            const originalText = payBtn.innerHTML;
            payBtn.innerHTML = '<span style="display: inline-block; width: 16px; height: 16px; border: 2px solid white; border-radius: 50%; border-top-color: transparent; animation: spin 0.5s linear infinite; vertical-align: middle;"></span> Processing...';
            payBtn.disabled = true;
            
            // Make test payment
            fetch(`/request/${currentRequestData.id}/payment/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": getCsrfToken(),
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: `method=test&phone=${encodeURIComponent(phone)}&amount=${currentRequestData.amount}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showSuccessPopup(data.transaction_id);
                } else {
                    alert('Payment failed: ' + (data.message || 'Unknown error'));
                    payBtn.innerHTML = originalText;
                    payBtn.disabled = false;
                }
            })
            .catch(error => {
                alert('Payment error: ' + error);
                payBtn.innerHTML = originalText;
                payBtn.disabled = false;
            });
        }
    }
    
    function showSuccessPopup(transactionId) {
        const popup = document.createElement('div');
        popup.id = 'successPopup';
        popup.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10001; display: flex; align-items: center; justify-content: center;';
        popup.innerHTML = `
            <div style="background: white; max-width: 350px; width: 90%; border-radius: 24px; padding: 24px; text-align: center;">
                <div style="font-size: 60px; color: #22c55e;"><i class="fas fa-check-circle"></i></div>
                <h3 style="margin: 12px 0 8px;">Payment Successful!</h3>
                <p style="color: #64748b;">Test payment completed successfully</p>
                <div style="background: #f8fafc; padding: 12px; border-radius: 12px; margin: 16px 0;">
                    <p><strong>Amount:</strong> UGX ${parseFloat(currentRequestData.amount).toLocaleString()}</p>
                    <p><strong>Reference:</strong> ${transactionId}</p>
                </div>
                <button onclick="confirmTestPayment('${transactionId}')" style="width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;">Continue</button>
            </div>
        `;
        document.body.appendChild(popup);
    }
    
    function confirmTestPayment(transactionId) {
        fetch(`/confirm-payment/${transactionId}/`, {
            method: "POST",
            headers: {
                "X-CSRFToken": getCsrfToken()
            }
        })
        .then(() => {
            window.location.reload();
        });
    }
    
    function closePaymentModal() {
        document.getElementById('paymentModal').style.display = 'none';
        // Remove any leftover popups
        const successPopup = document.getElementById('successPopup');
        if (successPopup) successPopup.remove();
    }
    
    function getCsrfToken() {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, 10) === ('csrftoken' + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(10));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Close modal on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('paymentModal');
            if (modal && modal.style.display === 'flex') {
                closePaymentModal();
            }
        }
    });
    
    // Add spin animation
    const style = document.createElement('style');
    style.textContent = `@keyframes spin { to { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
</script>
